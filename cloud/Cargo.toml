[package]
name = "cowiki-cloud"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "cowiki_cloud"
path = "src/lib.rs"

[[bin]]
name = "cowiki-cloud"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate"] }
subtle = "2"
thiserror = "2"
time = { version = "=0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

