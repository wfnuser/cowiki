[package]
name = "cowiki-desktop"
version = "0.1.0"
description = "CoWiki desktop client"
authors = ["CoWiki"]
edition = "2021"

[workspace]

[lib]
name = "cowiki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = [] }
time = "=0.3.44"
url = "2"
git2 = "0.20"
libc = "0.2"
portable-pty = "0.9"
pulldown-cmark = "0.13"
percent-encoding = "2"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
calamine = "0.36"
docx-rs = "0.4"
pdf-extract = "0.12"
quick-xml = "0.41"
# default-features off: the crate's `time` feature needs time>=0.3.47,
# which conflicts with this project's `time = "=0.3.44"` pin. Office/ODF
# zip parts only ever need DEFLATE decompression, not entry timestamps.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
