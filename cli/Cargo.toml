[workspace]

[package]
name = "cowiki-cli"
version = "0.1.0"
edition = "2021"
description = "CLI client for cowiki - collaborative wiki"

[[bin]]
name = "cowiki"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
colored = "2"
comfy-table = "7"
indicatif = "0.17"
toml = "0.8"
dotenvy = "0.15"
