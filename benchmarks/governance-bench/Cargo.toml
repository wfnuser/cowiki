[package]
name = "cowiki-governance-bench"
version = "0.1.0"
edition = "2021"
description = "Paired evaluation of CoWiki maintenance on Markdown revision episodes"
license = "Apache-2.0"

[workspace]

[dependencies]
cowiki-knowledge = { path = "../../crates/cowiki-knowledge" }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
remote-verifier = ["cowiki-knowledge/remote-verifier"]
