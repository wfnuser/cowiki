[package]
name = "cowiki-headless-local-test"
version = "0.1.0"
edition = "2021"
[lib]
path = "../../../web/src-tauri/src/governance_engine_tests.rs"

[workspace]
[dependencies]
cowiki-knowledge = { path = "../../../crates/cowiki-knowledge", features = ["remote-embeddings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "=0.3.44", features = ["formatting"] }
url = "2"
htmlmd-core = "0.1.2"
git2 = { version = "0.20", default-features = false }
libc = "0.2"
pulldown-cmark = "0.13"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
similar = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
calamine = "0.36"
docx-rs = "0.4"
pdf-extract = "0.12"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# default-features off: the crate's `time` feature needs time>=0.3.47,
# which conflicts with this project's `time = "=0.3.44"` pin. Office/ODF
# zip parts only ever need DEFLATE decompression, not entry timestamps.
zip = { version = "8", default-features = false, features = ["deflate"] }

tempfile = "3"
