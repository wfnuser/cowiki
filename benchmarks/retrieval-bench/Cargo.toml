[package]
name = "cowiki-retrieval-bench"
version = "0.1.0"
edition = "2021"
description = "Standalone, reproducible retrieval, OKF v0.3 governance, scaling, and concurrency benchmark for CoWiki's production cowiki-knowledge Rust engine"
license = "Apache-2.0"

[workspace]

[dependencies]
cowiki-knowledge = { path = "../../crates/cowiki-knowledge", features = ["remote-embeddings"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "=0.3.44", features = ["formatting"] }
