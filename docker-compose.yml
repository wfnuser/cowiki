services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cowiki
      POSTGRES_USER: cowiki
      POSTGRES_PASSWORD: cowiki
    ports:
      - "5432:5432"
    volumes:
      - type: ${PGDATA_TYPE:-volume}
        source: ${PGDATA_SOURCE:-pgdata}
        target: /var/lib/postgresql/data

volumes:
  pgdata:
