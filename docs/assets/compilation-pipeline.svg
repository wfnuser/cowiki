<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">CoWiki compilation pipeline</title>
  <desc id="desc">Four stages: Ingest, Compile, Lint, and human Review.</desc>

  <rect width="1600" height="650" fill="#efeae0"/>

  <g fill="#4a433a" font-family="Inter, Arial, sans-serif">
    <line x1="70" y1="52" x2="122" y2="52" stroke="#4a433a" stroke-width="1.5"/>
    <text x="146" y="61" font-size="19" font-weight="500" letter-spacing="5">COMPILATION PIPELINE</text>
  </g>

  <g fill="#8b8275" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3">
    <text x="70" y="178">01</text>
    <text x="470" y="178">02</text>
    <text x="870" y="178">03</text>
    <text x="1270" y="178">04</text>
  </g>

  <g stroke="#8b8275" stroke-width="4" stroke-linecap="round">
    <line x1="70" y1="238" x2="218" y2="238"/>
    <line x1="70" y1="256" x2="262" y2="256"/>
    <line x1="70" y1="274" x2="174" y2="274"/>
    <line x1="70" y1="292" x2="238" y2="292"/>
  </g>

  <g stroke="#1f1b16" stroke-width="3" fill="none">
    <line x1="570" y1="237" x2="512" y2="288"/>
    <line x1="570" y1="237" x2="628" y2="288"/>
    <line x1="570" y1="237" x2="570" y2="288"/>
  </g>
  <g fill="#1f1b16">
    <circle cx="570" cy="237" r="8"/>
    <circle cx="512" cy="288" r="8"/>
    <circle cx="570" cy="288" r="8"/>
    <circle cx="628" cy="288" r="8"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <g stroke="#8b8275" stroke-width="3">
      <line x1="870" y1="234" x2="1008" y2="234"/>
      <line x1="870" y1="263" x2="1008" y2="263"/>
      <line x1="870" y1="292" x2="1008" y2="292"/>
    </g>
    <g stroke="#1f1b16" stroke-width="3" stroke-linejoin="round">
      <polyline points="1022,230 1029,239 1040,221"/>
      <polyline points="1022,259 1029,268 1040,250"/>
    </g>
    <g stroke="#c8442a" stroke-width="3">
      <line x1="1022" y1="286" x2="1040" y2="298"/>
      <line x1="1040" y1="286" x2="1022" y2="298"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <circle cx="1318" cy="263" r="36" stroke="#c8442a" stroke-width="3"/>
    <polyline points="1301,263 1314,277 1338,247" stroke="#c8442a" stroke-width="3.5" stroke-linejoin="round"/>
    <g stroke="#8b8275" stroke-width="3">
      <line x1="1370" y1="247" x2="1456" y2="247"/>
      <line x1="1370" y1="264" x2="1430" y2="264"/>
      <line x1="1370" y1="281" x2="1446" y2="281"/>
    </g>
  </g>

  <g fill="#8b8275" font-family="Georgia, 'Times New Roman', serif" font-size="37">
    <text x="430" y="271">→</text>
    <text x="830" y="271">→</text>
    <text x="1230" y="271">→</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="-2">
    <text x="70" y="435" fill="#1f1b16">Ingest</text>
    <text x="470" y="435" fill="#1f1b16">Compile</text>
    <text x="870" y="435" fill="#1f1b16">Lint</text>
    <text x="1270" y="435" fill="#c8442a">Review</text>
  </g>

  <g fill="#8b8275" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="4">
    <text x="70" y="478">AI AUTO</text>
    <text x="470" y="478">AI AUTO</text>
    <text x="870" y="478">AI AUTO</text>
    <text x="1270" y="478">HUMAN</text>
  </g>
</svg>
