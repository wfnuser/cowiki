name: Deploy to Test

on:
  push:
    branches: [dev]

env:
  DOCKER_IMAGE: cowiki-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE:${{ github.sha }} -t $DOCKER_IMAGE:dev .

      - name: Save Docker image
        run: docker save $DOCKER_IMAGE:${{ github.sha }} | gzip > image.tar.gz

      - name: Copy image to test server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "image.tar.gz"
          target: "/tmp/cowiki-deploy"

      - name: Deploy on test server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            cd /opt/cowiki
            docker load < /tmp/cowiki-deploy/image.tar.gz
            docker compose -f docker-compose.prod.yml up -d --no-build backend
            rm -f /tmp/cowiki-deploy/image.tar.gz
            docker image prune -f
