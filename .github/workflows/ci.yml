name: CI

on:
  pull_request:
    branches: [dev, main, feat/review-source-flow]
  push:
    branches: [dev, main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Test desktop workflow contract
        run: npm run test:desktop-workflow
      - name: Test auth flow
        run: npm run test:auth-flow
      - name: Test Cloud desktop contract
        run: npm run test:cloud-sync
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Tauri shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cowiki-mcp-server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cowiki-mcp-server -> target
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: cowiki
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://postgres:cowiki@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloud -> target
      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path cloud/Cargo.toml -- --check
      - name: Test PostgreSQL and Git control plane
        run: cargo test --locked --manifest-path cloud/Cargo.toml
      - name: Verify publish and permission workflow
        run: ./scripts/cloud-e2e.sh
      - name: Check deployment contract
        run: bash cloud/tests/container_contract.sh
