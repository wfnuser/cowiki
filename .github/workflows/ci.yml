name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Test frontend contracts and components
        run: npm test
      - name: Install sandbox test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test HTML isolation in Chromium and WebKit
        run: npm run test:browser
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Tauri shell
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cowiki-mcp-server
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cowiki-mcp-server -> target
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  knowledge-bench:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/cowiki-knowledge -> target
            benchmarks/retrieval-bench -> target
      - name: Check cowiki-knowledge formatting and lints
        run: |
          cargo fmt --all --manifest-path crates/cowiki-knowledge/Cargo.toml -- --check
          cargo clippy --manifest-path crates/cowiki-knowledge/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test cowiki-knowledge crate
        run: cargo test --manifest-path crates/cowiki-knowledge/Cargo.toml --all-features
      - name: Check standalone benchmark formatting and lints
        run: |
          cargo fmt --all --manifest-path benchmarks/retrieval-bench/Cargo.toml -- --check
          cargo clippy --manifest-path benchmarks/retrieval-bench/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test standalone benchmark harness
        run: cargo test --manifest-path benchmarks/retrieval-bench/Cargo.toml --locked
      - name: Run standalone retrieval & governance benchmark gate
        run: cargo run --manifest-path benchmarks/retrieval-bench/Cargo.toml --release --locked -- --scale-pages 100,500 --queries-per-thread 20 --out /tmp/cowiki-retrieval-bench.json

  governance-bench:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_OFFLINE: "true"
    defaults:
      run:
        working-directory: benchmarks/governance-bench
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/governance-bench -> target
      - name: Populate the locked dependency cache
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Check formatting, lints and tests offline
        run: |
          cargo fmt --all -- --check
          cargo clippy --offline --locked --all-targets --all-features -- -D warnings
          cargo test --offline --locked --all-features
      - name: Reproduce both CMake development baselines
        run: |
          for method in none rules; do
            cargo run --offline --locked --release -- --split dev --verifier "$method" --baseline --out "$RUNNER_TEMP/dev-$method.json"
            cmp "$RUNNER_TEMP/dev-$method.json" "results/dev-$method.json"
          done
