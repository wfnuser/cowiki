[package]
name = "cowiki-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
