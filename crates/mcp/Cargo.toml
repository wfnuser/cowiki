[package]
name = "cowiki-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for cowiki — rmcp-based, 5 wiki primitives"

[dependencies]
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "0.8"
cowiki-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[[bin]]
name = "cowiki-mcp"
path = "src/main.rs"
