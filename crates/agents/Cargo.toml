[package]
name = "cowiki-agents"
version = "0.1.0"
edition = "2021"
description = "Agent harness protocol, registry, dispatch, and SSE events for cowiki compile system"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
url = "2"
async-trait = "0.1"
cowiki-utils = { path = "../utils" }
