[package]
name = "cowiki-extractor"
version = "0.1.0"
edition = "2021"
description = "URL content extraction library — fetch, extract, clean"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.27"
readability = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
serde = { version = "1", features = ["derive"] }
